name: Test SQLAlchemy Project in Docker

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t sqlalchemy-demo .

      - name: Run tests inside container
        run: docker run sqlalchemy-demo
